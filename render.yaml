# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates the web service (Node) and a PostgreSQL database. Currently on the FREE plans (testing).
services:
  - type: web
    name: jpm-purchase
    runtime: node
    # FREE plan (testing): sleeps after 15 min idle, and uploads are lost on each deploy/restart
    # because free instances have no persistent disk. For real use switch to `plan: starter`
    # and add back the disk below (mountPath /var/data, STORAGE_DIR=/var/data/uploads).
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jpm-purchase-db
          property: connectionString
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # First admin account, created on first start when the database has no users.
      # Render asks for these values when the Blueprint is created.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: jpm-purchase-db
    plan: free # Render deletes free databases after 30 days — use basic-256mb for real use
    region: singapore
    databaseName: jpm_purchase
    user: jpm
