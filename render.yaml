# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates the web service (Node), a PostgreSQL database and a persistent disk for uploads.
services:
  - type: web
    name: jpm-purchase
    runtime: node
    plan: starter # a persistent disk needs a paid instance; the free plan would lose uploads
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jpm-purchase-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data/uploads
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # First admin account, created on first start when the database has no users.
      # Render asks for these values when the Blueprint is created.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: jpm-purchase-db
    plan: basic-256mb
    region: singapore
    databaseName: jpm_purchase
    user: jpm
